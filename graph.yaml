# 알림 자동화의 흐름도 — Claude 가 도는 구간의 "허용된 경로" 전부다. 여기 없는 길로는 가지 못한다.
#
# 단계 이름은 업무 말: 수집(collect) → 작성(draft) → 검수(review) → 승인(approve).
# 블로그와 같은 네 단계, 같은 차단 장치(.claude/hooks/)다. 다른 것은 각 단계가 부르는 스크립트와 아래 ask 글뿐이다.
#
# 이 흐름도 **밖**에서 끝나는 것 셋 — 모두 정상이다
#   quiet      scripts/request.sh 가 모델 없이 시세를 보고, 걸린 조건이 없거나 이미 다 보냈으면
#              요청을 열지 않고 끝낸다. Claude 를 부르지 않는다 (5분마다 도는 tick 의 대부분)
#   sent       사람이 문구를 읽고 scripts/approve.sh <요청 id> <지문> 을 치면 scripts/deliver.py 가 보낸다
#   duplicate  같은 승인을 또 주거나 이미 보낸 알림이면 deliver.py 가 보내지 않고 끝낸다
# 그래서 아래 terminal 에는 Claude 흐름이 닿을 수 있는 셋만 있다. 보내기(deliver)는 Claude 에게 도구가 없다.
#
# 누가 하나(by)
#   script   차단 장치 next_step.py · run_review.py 가 그 명령을 직접 실행한다. 모델을 부르지 않는다
#   drafter  Claude 가 하위 에이전트 drafter 에게 맡긴다. 여기서만 모델이 일한다
#
# 다음에 어디로 갈지는 단계가 끝날 때 남기는 신호(숫자)가 정한다. 출력 글을 읽어 판단하지 않는다.
#   0 됐다 / 1 검수가 거부 / 2 형식 위반 / 3 사람 차례 / 64 실행 환경 문제
#
# 키를 `on:` 이라고 쓰지 않는다 — YAML 에서 on 은 true 로 읽힌다. 그래서 next: 다.

start: collect

steps:
  collect:
    by: script
    # 시세를 읽고 조건을 판정한다. 숫자 판정은 코드가 한다 — 모델에 맡기면 무엇으로 검사할지가 사라진다.
    run: uv run python scripts/collect.py {id}
    next:
      0: draft
      2: failed       # 조건이 가리키는 종목의 시세가 없다
      64: failed      # 시세 파일이 없거나, 요청을 연 뒤 이미 다 보냈다

  draft:
    by: drafter
    ask: "요청 {id} 의 알림 문구를 쓰게 하세요. 읽을 것 requests/{id}/brief.json(관측 날짜와 걸린 조건), 쓸 곳 requests/{id}/draft.json."
    retry_hint: "관측값을 반올림하거나 바꾸지 말고, 걸린 조건을 빼거나 더하지 말고, 전망·판단 낱말을 쓰지 마세요. 일어난 일만 적습니다."
    max_visits: 3
    when_exhausted: needs_human
    next:
      0: review

  review:
    by: script
    run: uv run python review.py --request {id}
    next:
      0: approve
      1: draft        # 거부(C1~C4) — 이유를 붙여 작성으로 되돌린다
      2: failed       # 문구 파일이 JSON 이 아니다
      64: failed

  approve:
    by: script
    # 문구 파일의 지문(SHA-256 64자리)을 적고 승인하는 법을 알린 뒤 멈춘다. **보내지 않는다.**
    # 모델이 쓴 자유 문장이라 사람이 읽어야 나간다 — 3 은 "사람 차례".
    run: uv run python scripts/request_approval.py {id}
    next:
      3: needs_approval
      64: failed

terminal:
  - needs_approval   # 사람이 문구를 읽고 승인할 차례 — 실패가 아니다
  - needs_human      # 세 번 작성해도 검수를 못 넘었다
  - failed

max_steps: 12
