# AAPL 이 200 을 넘은 날. 알림이 **한 번** 나가야 한다.
#
# 블로그와 케이스 모양이 다르다. 업무가 다르니 당연하다 —
# 같은 것은 차단 장치와 흐름도의 약속이지 케이스 형식이 아니다.

expect: alert          # alert | quiet | reject

data: data/2026-08-31.json

# 조건은 **사람이 적는다.** 모델이 정하지 않는다.
# 숫자 판정을 모델에 맡기면 무엇으로 검사할지가 사라진다.
conditions:
  - id: aapl-above-200
    symbol: AAPL
    kind: above
    threshold: 200

  - id: tsla-above-300
    symbol: TSLA
    kind: above
    threshold: 300

  - id: nvda-volume-spike
    symbol: NVDA
    kind: volume_above
    threshold: 200000000

# 이 케이스에서 걸려야 하는 조건. 검사가 이걸 본다.
expected_hits:
  - aapl-above-200
  - nvda-volume-spike
